# STYX v1 testnet implementation workspace.
#
# Crate graph:
#   styx-node -> styx-pset -> styx-core
# styx-core and styx-pset are pure (no node, no IO); elementsd appears only in styx-node.
#
# simplicityhl is pinned by rev: the prune verdict of `satisfy_with_env` is the test oracle for the whole prune-level tier,
# so this rev must not float. Bumping it requires re-running the e2e negative spot-checks
# (prune verdict == node verdict calibration).

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
simplicityhl = { git = "https://github.com/BlockstreamResearch/SimplicityHL", rev = "63cd0924c44fc2fa0d774ef5083a3123865fb4d0" }
secp256k1 = { version = "0.29.0", features = ["rand-std"] }
elementsd = "0.11.0"
thiserror = "1"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
# The role-daemon runtime. nostr-sdk is pinned exactly: 0.45 is an alpha with API churn, and
# the relay-builder (the LocalRelay test fixture) must match it version-for-version.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal"] }
axum = "0.8"
nostr-sdk = "=0.44.1"
nostr-relay-builder = "=0.44.1"
tower = "0.5"
tokio-stream = { version = "0.1", features = ["sync"] }
rand = "0.8"
# The price feed pulls public exchange tickers over HTTPS; rustls avoids the system
# openssl dependency in the nix shell.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.test]
# Simplicity compilation and pruning in the prune-level tier are CPU-bound; opt-level 1 keeps
# the fast tiers fast without hurting build times much.
opt-level = 1
