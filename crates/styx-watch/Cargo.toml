[package]
name = "styx-watch"
version = "0.1.0"
edition = "2021"
publish = false
description = "STYX v1 daemon base: shared network config, chain indexer, oracle quote client"

[dependencies]
styx-core = { path = "../styx-core" }
styx-node = { path = "../styx-node" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
nostr-sdk = { workspace = true }

[dev-dependencies]
# The prune-tier loop-closure tests build real transactions; the LIB stays pset-free
# (the explorer links it and must carry no signing code).
styx-pset = { path = "../styx-pset" }
nostr-relay-builder = { workspace = true }
