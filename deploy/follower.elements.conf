# styxnet follower (oracle / wallet / keeper machines). The top block matches the
# producer's exactly, plus anyonecanspendaremine=0: without it every wallet claims the
# same OP_TRUE genesis coins and reports phantom balances.
chain=styxnet
initialfreecoins=210000000000
evbparams=simplicity:-1:::
validatepegin=0
pchmessagestart=53545958
anyonecanspendaremine=0
fallbackfee=0.0001
blindedaddresses=0
txindex=1
# RPC is localhost-only here (see [styxnet] rpcbind), so a plaintext pair is acceptable;
# for a shared machine prefer an rpcauth= line as in the producer template.
rpcuser=styx
rpcpassword=CHANGE-ME

[styxnet]
port=18886
rpcport=18884
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
connect=PRODUCER-IP:18886
