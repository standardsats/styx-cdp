# A Liquid-testnet node for any STYX role (user wallet, keeper, oracle, infra). The public
# chain's consensus params are built in - nothing here is consensus, unlike the styxnet
# templates. Needs the Simplicity-capable elementsd from the flake.
chain=liquidtestnet
validatepegin=0
fallbackfee=0.0001
# Our protocol outputs are explicit; the node wallet is only the tL-BTC on-ramp.
blindedaddresses=0
# RPC auth: generate with share/rpcauth/rpcauth.py and paste; keep RPC loopback-only.
rpcauth=styx:REPLACE-WITH-GENERATED-SALT$REPLACE-WITH-GENERATED-HMAC

[liquidtestnet]
rpcport=18884
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
