# styxnet block producer. The top block is consensus: identical on every machine (a
# mismatch in evbparams does not change the genesis but forks the chain at the first
# Simplicity spend). Only the [styxnet] section and wallet lines may differ per machine.
chain=styxnet
initialfreecoins=210000000000
evbparams=simplicity:-1:::
validatepegin=0
# Unique network magic: every Elements custom chain shares one default, so two private
# networks on a LAN would cross-talk without this.
pchmessagestart=53545958
fallbackfee=0.0001
blindedaddresses=0
txindex=1
# RPC auth: generate a salted line and put it here.
#   python3 <elements>/share/rpcauth/rpcauth.py styx
# paste the printed `rpcauth=...` line below and keep the printed password for clients.
rpcauth=styx:REPLACE-WITH-GENERATED-SALT$REPLACE-WITH-GENERATED-HMAC
# Plaintext fallback for a throwaway closed LAN only - prefer rpcauth above.
# rpcuser=styx
# rpcpassword=CHANGE-ME

# Network options are NETWORK_ONLY: outside this section elementsd silently ignores them.
[styxnet]
port=18886
rpcport=18884
listen=1
bind=0.0.0.0
rpcbind=0.0.0.0
rpcallowip=10.0.0.0/24
whitelist=10.0.0.0/24
